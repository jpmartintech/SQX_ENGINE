base_config: configs/eurusd_h1_grammar_v17_250k_clean.yaml
markets:
- EURUSD
- GBPUSD
- NZDUSD
- USDCAD
- USDCHF
- USDJPY
- XAUUSD
timeframes:
- M15
- H1
- H4
